services:
  postgres:
    image: postgres:16-alpine
    container_name: kids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kids
      POSTGRES_PASSWORD: kids_secret
      POSTGRES_DB: kids
    ports:
      - "7432:5432"
    volumes:
      - kids_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kids -d kids"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kids-redis
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  kids_pgdata: